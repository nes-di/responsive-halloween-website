<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Halloween Website</title>

    <!-- Boxicons (icônes) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!--==================== HEADER ====================-->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="#" class="nav__logo">
                <img src="assets/img/logo.png" alt="Logo" class="nav__logo-img">
                Halloween
            </a>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="#home" class="nav__link active-link">Home</a>
                    </li>
                    <li class="nav__item">
                        <a href="#about" class="nav__link">About</a>
                    </li>
                    <li class="nav__item">
                        <a href="#candy" class="nav__link">Candy</a>
                    </li>
                    <li class="nav__item">
                        <a href="#new" class="nav__link">New</a>
                    </li>
                    <a href="#" class="button button--ghost">Support</a>
                </ul>

                <div class="nav__close" id="nav-close">
                    <i class="bx bx-x"></i>
                </div>

                <img src="assets/img/nav-img.png" alt="" class="nav__img">
            </div>

            <div class="nav__toggle" id="nav-toggle">
                <i class="bx bx-grid-alt"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <!--==================== HOME ====================-->
        <section class="home container" id="home">
            <div class="home__content grid">
                <div class="home__group">
                    <!-- Vérifie si ton image s'appelle home1-img.png ou home-img.png -->
                    <img src="assets/img/home1-img.png" alt="Home image" class="home__img">
                    <div class="home__indicator"></div>

                    <div class="home__details-img">
                        <h4 class="home__details-title">The Labu “Re-spローk”</h4>
                        <span class="home__details-subtitle">The Living Pumpkin</span>
                    </div>
                </div>

                <div class="home__data">
                    <h3 class="home__subtitle">#1 Top Scariest Ghost</h3>
                    <h1 class="home__title">UOOO <br> TRICK OR <br> TREAT!!</h1>
                    <p class="home__description">
                        Hi, I'm Pumpkin. It's Halloween, celebrate with us and have fun collecting candy with trick or treat.
                    </p>

                    <div class="home__buttons">
                        <a href="#" class="button">Book Now</a>
                        <a href="#" class="button--link button--flex">
                            Track Record <i class="bx bx-right-arrow-alt button__icon"></i>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
